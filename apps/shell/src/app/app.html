<enc-vis-shell-header (cardChoosen)="cardAddedHandler($event)"></enc-vis-shell-header>
<main class="w-full h-[calc(100vh-2.5rem)] overflow-y-auto">
  @for (microfrontend of microfrontends(); track microfrontend.id) {
    @switch (microfrontend.framework) {
      @case ('Angular') {
        <enc-vis-shell-angular-wrapper [angularAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" [algorithm]="microfrontend.algorithm"
          (cardDestroy)="removeCardHandler(microfrontend.id)">
        </enc-vis-shell-angular-wrapper>
      }

      @case ('React') {
        <enc-vis-shell-react-wrapper [reactAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" [algorithm]="microfrontend.algorithm"
          (cardDestroy)="removeCardHandler(microfrontend.id)">
        </enc-vis-shell-react-wrapper>
      }
    }
  }
</main>
<router-outlet></router-outlet>
