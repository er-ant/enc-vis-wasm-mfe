<enc-vis-shell-header (cardChoosen)="cardAddedHandler($event)"></enc-vis-shell-header>
<main class="w-full h-[calc(100vh-2.5rem)] overflow-y-auto bg-primary/5 p-3 flex flex-wrap content-baseline gap-4">
  @for (microfrontend of microfrontends(); track microfrontend.id) {
    @switch (microfrontend.framework) {
      @case ('Angular') {
        <enc-vis-shell-angular-wrapper class="w-full lg:w-[calc(50%-8px)]" [angularAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" [algorithm]="microfrontend.algorithm"
          (cardDestroy)="removeCardHandler(microfrontend.id)">
        </enc-vis-shell-angular-wrapper>
      }

      @case ('React') {
        <enc-vis-shell-react-wrapper class="w-full lg:w-[calc(50%-8px)]" [reactAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" [algorithm]="microfrontend.algorithm"
          (cardDestroy)="removeCardHandler(microfrontend.id)">
        </enc-vis-shell-react-wrapper>
      }
    }
  }
</main>
<router-outlet></router-outlet>
