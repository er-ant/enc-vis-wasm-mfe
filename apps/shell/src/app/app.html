<enc-vis-shell-header (cardChoosen)="cardAddedHandler($event)"></enc-vis-shell-header>
<main>
  @for (microfrontend of microfrontends(); track $index) {
    @switch (microfrontend.framework) {
      @case ('Angular') {
        <enc-vis-shell-angular-wrapper [angularAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" (cardDestroy)="removeCardHandler(microfrontend.id)"></enc-vis-shell-angular-wrapper>
      }

      @case ('React') {
        <enc-vis-shell-react-wrapper [reactAppInfo]="MICROFRONTENDS_MODULE_INFO[microfrontend.framework]" (cardDestroy)="removeCardHandler(microfrontend.id)"></enc-vis-shell-react-wrapper>
      }
    }
  }
</main>
<router-outlet></router-outlet>
