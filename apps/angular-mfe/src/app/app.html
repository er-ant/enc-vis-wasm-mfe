@switch (algorithm()) {
  @case (encryptions.Cesar)
  @case (encryptions.CesarKey) {
    <enc-vis-ng-mfe-cesar [algorithm]="algorithm()">
      <div class="flex justify-between">
        Angular-MFE - {{ algorithm() }}
        <button class="cursor-pointer" type="button" (click)="onClose.emit(true)">✖</button>
      </div>
    </enc-vis-ng-mfe-cesar>
  }

  @case (encryptions.Vigenere) {
    <enc-vis-ng-mfe-vigenere>
      <div class="flex justify-between">
        Angular-MFE - {{ algorithm() }}
        <button class="cursor-pointer" type="button" (click)="onClose.emit(true)">✖</button>
      </div>
    </enc-vis-ng-mfe-vigenere>
  }

  @case (encryptions.Huffman) {
    <enc-vis-ng-mfe-huffman>
      <div class="flex justify-between">
        Angular-MFE - {{ algorithm() }}
        <button class="cursor-pointer" type="button" (click)="onClose.emit(true)">✖</button>
      </div>
    </enc-vis-ng-mfe-huffman>
  }
}
<router-outlet></router-outlet>
